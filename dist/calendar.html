<!doctype html>
<html lang="es" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi calendario · Álvaro Rodríguez Molina</title>
  <meta name="description" content="Mi calendario personal: eventos, trayectoria profesional, tareas y entrenos en un solo sitio.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <script>
    // Same theme and accent the visitor picked on the portfolio, before first paint.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      document.documentElement.dataset.accent = localStorage.getItem('accent') || 'blue';
    } catch (e) {
      document.documentElement.dataset.accent = 'blue';
    }
  </script>
  <script type="module" crossorigin src="./assets/calendar-BB7iHUoe.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/calendar-2luUVaOL.css">
</head>

<body>
  <header class="cal-top">
    <a class="cal-brand" href="./index.html" aria-label="Volver al portfolio">
      <span class="cal-brand-mark" aria-hidden="true"><img src="./images/favicon-192.png" alt="" width="40" height="40"></span>
      <span class="cal-brand-copy">
        <strong>alvrich</strong>
        <small>mi calendario</small>
      </span>
    </a>

    <nav class="cal-apps" aria-label="Mis herramientas">
      <a href="./planning.html">Bubble</a>
      <a href="./gym.html">Gym</a>
    </nav>

    <button class="cal-icon-btn" type="button" data-theme-toggle aria-label="Cambiar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="cal-shell">
    <section class="cal-main" aria-labelledby="cal-title">
      <div class="cal-toolbar">
        <h1 class="cal-title" id="cal-title" data-cal-title>Calendario</h1>

        <div class="cal-controls">
          <div class="cal-switch" role="tablist" aria-label="Vista">
            <button type="button" role="tab" data-view="year" aria-selected="true">Año</button>
            <button type="button" role="tab" data-view="month" aria-selected="false">Mes</button>
          </div>
          <button class="cal-btn" type="button" data-nav="today">Hoy</button>
          <button class="cal-icon-btn" type="button" data-nav="prev" aria-label="Anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="cal-icon-btn" type="button" data-nav="next" aria-label="Siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="cal-layers" role="group" aria-label="Capas">
        <button type="button" class="cal-layer" data-layer="events" aria-pressed="true"><span class="dot"></span>Eventos</button>
        <button type="button" class="cal-layer" data-layer="career" aria-pressed="true"><span class="dot"></span>Trayectoria</button>
        <button type="button" class="cal-layer" data-layer="tasks" aria-pressed="true"><span class="dot"></span>Tareas</button>
        <button type="button" class="cal-layer" data-layer="gym" aria-pressed="true"><span class="dot"></span>Gym</button>
      </div>

      <div class="cal-view" data-cal-view></div>
    </section>

    <aside class="cal-side" aria-label="Resumen">
      <section class="cal-card cal-next">
        <h2>Próximo</h2>
        <ul class="cal-next-list" data-cal-next></ul>
      </section>

      <section class="cal-card cal-now">
        <h2>Ahora mismo</h2>
        <ul class="cal-now-list" data-cal-now></ul>
      </section>
    </aside>
  </main>

  <dialog class="cal-day" data-cal-day aria-labelledby="cal-day-title">
    <form method="dialog" class="cal-day-close">
      <button class="cal-icon-btn" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <p class="cal-day-kicker" data-cal-day-kicker></p>
    <h2 class="cal-day-title" id="cal-day-title" data-cal-day-title></h2>
    <div class="cal-day-body" data-cal-day-body></div>

    <form class="cal-add" data-cal-add>
      <h3>Añadir evento</h3>
      <div class="cal-add-row">
        <input name="emoji" maxlength="4" placeholder="🎉" aria-label="Emoji" class="cal-add-emoji">
        <input name="title" required maxlength="80" placeholder="Título del evento" aria-label="Título">
      </div>
      <label class="cal-add-check"><input type="checkbox" name="yearly"> Repetir cada año</label>
      <button class="cal-btn cal-btn-primary" type="submit">Guardar evento</button>
    </form>
  </dialog>
</body>
</html>
