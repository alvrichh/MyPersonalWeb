<!doctype html>
<html lang="en" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My calendar · Álvaro Rodríguez Molina</title>
  <meta name="description" content="My personal calendar: events, career milestones and tasks in one place.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <script>
    // Same theme and accent the visitor picked on the portfolio, before first paint.
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      document.documentElement.dataset.accent = localStorage.getItem('accent') || 'blue';
    } catch (e) {
      document.documentElement.dataset.accent = 'blue';
    }
  </script>
  <link rel="stylesheet" href="/src/legacy/calendar/calendar.css">
</head>

<body>
  <header class="cal-top">
    <a class="cal-brand" href="./index.html" aria-label="Back to the portfolio" data-t-attr="aria-label:backToPortfolio">
      <span class="cal-brand-mark" aria-hidden="true"><img src="./images/favicon-192.png" alt="" width="40" height="40"></span>
      <span class="cal-brand-copy">
        <strong>alvrich</strong>
        <small data-t="brandSub">my calendar</small>
      </span>
    </a>

    <nav class="cal-apps" aria-label="My tools" data-t-attr="aria-label:tools">
      <a href="./planning.html">Bubble</a>
    </nav>

    <button class="cal-icon-btn" type="button" data-theme-toggle aria-label="Toggle theme" data-t-attr="aria-label:toggleTheme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="cal-shell">
    <section class="cal-main" aria-labelledby="cal-title">
      <div class="cal-toolbar">
        <h1 class="cal-title" id="cal-title" data-cal-title>Calendar</h1>

        <div class="cal-controls">
          <div class="cal-switch" role="tablist" aria-label="View" data-t-attr="aria-label:view">
            <button type="button" role="tab" data-view="year" aria-selected="true" data-t="year">Year</button>
            <button type="button" role="tab" data-view="month" aria-selected="false" data-t="month">Month</button>
          </div>
          <button class="cal-btn" type="button" data-nav="today" data-t="today">Today</button>
          <button class="cal-icon-btn" type="button" data-nav="prev" aria-label="Previous" data-t-attr="aria-label:previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="cal-icon-btn" type="button" data-nav="next" aria-label="Next" data-t-attr="aria-label:next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="cal-layers" role="group" aria-label="Layers" data-t-attr="aria-label:layers">
        <button type="button" class="cal-layer" data-layer="events" aria-pressed="true"><span class="dot"></span><span data-t="events">Events</span></button>
        <button type="button" class="cal-layer" data-layer="career" aria-pressed="true"><span class="dot"></span><span data-t="career">Career</span></button>
        <button type="button" class="cal-layer" data-layer="tasks" aria-pressed="true"><span class="dot"></span><span data-t="tasks">Tasks</span></button>
      </div>

      <div class="cal-view" data-cal-view></div>
    </section>

    <aside class="cal-side" aria-label="Summary" data-t-attr="aria-label:summary">
      <section class="cal-card cal-next">
        <h2 data-t="upcoming">Coming up</h2>
        <ul class="cal-next-list" data-cal-next></ul>
      </section>

      <section class="cal-card cal-now">
        <h2 data-t="rightNow">Right now</h2>
        <ul class="cal-now-list" data-cal-now></ul>
      </section>
    </aside>
  </main>

  <dialog class="cal-day" data-cal-day aria-labelledby="cal-day-title">
    <form method="dialog" class="cal-day-close">
      <button class="cal-icon-btn" aria-label="Close" data-t-attr="aria-label:close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <p class="cal-day-kicker" data-cal-day-kicker></p>
    <h2 class="cal-day-title" id="cal-day-title" data-cal-day-title></h2>
    <div class="cal-day-body" data-cal-day-body></div>

    <form class="cal-add" data-cal-add>
      <h3 data-t="addEvent">Add an event</h3>
      <div class="cal-add-row">
        <input name="emoji" maxlength="4" placeholder="🎉" aria-label="Emoji" class="cal-add-emoji">
        <input name="title" required maxlength="80" placeholder="Event title" aria-label="Title" data-t-attr="placeholder:eventTitle;aria-label:titleLabel">
      </div>
      <label class="cal-add-check"><input type="checkbox" name="yearly"> <span data-t="repeatYearly">Repeat every year</span></label>
      <button class="cal-btn cal-btn-primary" type="submit" data-t="saveEvent">Save event</button>
    </form>
  </dialog>
  <script type="module" src="/src/legacy/calendar/calendar.js"></script>
</body>
</html>
